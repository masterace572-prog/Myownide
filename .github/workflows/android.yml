name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.9
          cache-provider: basic

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: |
          ARGS=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then ARGS="$ARGS -PSUPABASE_URL=${{ secrets.SUPABASE_URL }}"; fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then ARGS="$ARGS -PSUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"; fi
          set +e
          ./gradlew :app:assembleDebug --stacktrace $ARGS > build-log.txt 2>&1
          CODE=$?
          cat build-log.txt
          exit $CODE

      - name: Upload build log on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        if: success()
        run: ./gradlew :app:testDebugUnitTest --stacktrace
